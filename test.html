<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wonder Jar — tests</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0c2a; color: #eee; padding: 20px; }
  h1 { font-size: 20px; }
  .warn { color: #ffd66b; font-size: 13px; }
  #results div { padding: 4px 8px; font-size: 14px; }
  .pass { color: #7be0d6; }
  .fail { color: #ff8896; font-weight: bold; }
  #summary { margin-top: 12px; font-size: 16px; font-weight: bold; }
  #stage { width: 420px; height: 700px; border: 1px solid #333; margin-top: 16px; opacity: .6; }
</style>
</head>
<body>
<h1>🫙 Wonder Jar — follow-up question tests</h1>
<p class="warn">Serve over http(s) and open this page. Your real jar data is snapshotted before the tests run and restored afterward.</p>
<div id="results"></div>
<div id="summary">Running…</div>
<iframe id="stage"></iframe>

<script>
/* ============================================================
   Zero-dependency test harness.
   Loads the real app in an iframe with the Anthropic API stubbed
   (scripted questions), drives the UI like a kid would, and
   asserts on the records in localStorage.

   What it proves:
   - each unique follow-up question is stored as its own {q, a}
     pair on the entry (never mushed into the entry text)
   - a repeated question never creates a second slot
   - the one-glowing-thought-per-night append still works
   - follow-ups stop after MAX_FOLLOWUPS questions
   ============================================================ */

const results = document.getElementById('results');
const summary = document.getElementById('summary');
let failures = 0;

function report(ok, label, detail) {
  const d = document.createElement('div');
  d.className = ok ? 'pass' : 'fail';
  d.textContent = (ok ? '✅ ' : '❌ ') + label + (ok || !detail ? '' : ' — ' + detail);
  results.appendChild(d);
  if (!ok) failures++;
}
function assertEqual(actual, expected, label) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  report(ok, label, ok ? '' : 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
}
function assert(cond, label, detail) { report(!!cond, label, detail); }

/* ---- canvas spying: what colour was each glyph actually painted with? ---- */
function offscreenCtx(doc) {
  const c = doc.createElement('canvas');
  c.width = 300; c.height = 500;
  return c.getContext('2d');
}
function alphaOf(fill) {
  const m = String(fill).match(/rgba\([^)]*,\s*([\d.]+)\s*\)/);
  return m ? Number(m[1]) : 1;
}
// wraps a real 2d context, recording the live fillStyle at each matching fillText
function fillSpy(ctx, match, sink) {
  return new Proxy(ctx, {
    get(t, k) {
      const v = t[k];
      if (k === 'fillText') return (txt, x, y) => {
        if (match(String(txt))) sink.push({ txt: String(txt), fill: String(t.fillStyle) });
        return v.call(t, txt, x, y);
      };
      return typeof v === 'function' ? v.bind(t) : v;
    },
    set(t, k, val) { t[k] = val; return true; }
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function waitFor(fn, label, timeout = 8000) {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    try { const v = fn(); if (v) return v; } catch (e) {}
    await sleep(100);
  }
  throw new Error('Timed out waiting for: ' + label);
}

/* ---- real-data safety: snapshot every wonderjar_* key, restore at the end ---- */
function snapshotStore() {
  const snap = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('wonderjar_')) snap[k] = localStorage.getItem(k);
  }
  return snap;
}
function wipeStore() {
  for (const k of Object.keys(snapshotStore())) localStorage.removeItem(k);
}
function restoreStore(snap) {
  wipeStore();
  for (const [k, v] of Object.entries(snap)) localStorage.setItem(k, v);
}

/* ---- boot the real app in the iframe with stubs injected before its script ---- */
async function bootApp(questions, store = {}) {
  wipeStore();
  // pass null to leave a key unset (e.g. phone_owner: null → first-launch picker shows)
  const seed = { anthropic_key: 'test-key', phone_owner: 'family', ...store };
  for (const [k, v] of Object.entries(seed)) {
    if (v !== null) localStorage.setItem('wonderjar_' + k, JSON.stringify(v));
  }

  // external font stylesheets block script execution while pending — tests must run offline
  const html = (await (await fetch('index.html')).text())
    .replace(/<link[^>]*fonts\.g[^>]*>/g, '');
  const stub = `<script>
    window.SpeechRecognition = undefined;   // force the typing path
    window.webkitSpeechRecognition = undefined;
    try {
      Object.defineProperty(navigator, 'serviceWorker', {
        value: { register: () => Promise.resolve(), controller: null }
      });
    } catch (e) {}
    window.__claudeCalls = 0;
    const __questions = ${JSON.stringify(questions)};
    const __realFetch = window.fetch.bind(window);
    window.fetch = (url, opts) => {
      const u = String(url);
      if (u.includes('api.anthropic.com')) {
        const q = __questions[Math.min(window.__claudeCalls, __questions.length - 1)];
        window.__claudeCalls++;
        return Promise.resolve(new Response(
          JSON.stringify({ content: [{ type: 'text', text: q }] }), { status: 200 }));
      }
      if (u.includes('api.github.com')) return Promise.reject(new Error('blocked in tests'));
      return __realFetch(url, opts);
    };
  <\/script>`;

  // a fresh iframe per scenario — document.open() reuses the window, so old script bindings would clash
  const old = document.getElementById('stage');
  const iframe = document.createElement('iframe');
  iframe.id = 'stage';
  old.replaceWith(iframe);
  const doc = iframe.contentDocument;
  doc.open();
  doc.write(html.replace('<script>', stub + '\n<script>'));
  doc.close();
  await waitFor(() => doc.querySelector('.kid-card'), 'app boot');
  return { doc, win: iframe.contentWindow };
}

/* ---- UI driving helpers ---- */
function clickKid(doc, name) {
  const card = [...doc.querySelectorAll('.kid-card')]
    .find(c => c.querySelector('.kid-name').textContent === name);
  card.click();
}
async function typeAndSave(doc, text) {
  if (doc.getElementById('type-link').style.display !== 'none') doc.getElementById('type-link').click();
  doc.getElementById('transcript-box').value = text;
  doc.getElementById('save-btn').click();
}
async function dismissRevealsUntilFollowUp(doc) {
  return waitFor(() => {
    const card = doc.getElementById('followup-card');
    if (card) return card;
    const btn = doc.querySelector('.modal-overlay .btn-primary');
    if (btn) btn.click();  // glimmer / badge reveal — click through the celebration queue
    return null;
  }, 'follow-up card');
}
function answerFollowUp(doc, answer) {
  const more = [...doc.querySelectorAll('#followup-card button')]
    .find(b => b.textContent.includes('Tell more'));
  more.click();  // shows the typing box (SR is stubbed out)
  doc.getElementById('transcript-box').value = answer;
  doc.getElementById('save-btn').click();
}
function riverEntry() {
  const data = JSON.parse(localStorage.getItem('wonderjar_data'));
  return Object.values(data.records).find(r => r.type === 'entry' && r.kidId === 'river' && !r.deleted);
}

/* ---- scenario 1: unique questions → unique answers ---- */
async function scenarioUniquePairs() {
  const Q1 = 'Who was with you when it happened?';
  const Q2 = 'What did it feel like right at that moment?';
  const Q3 = 'Why do you think it mattered so much?';
  const { doc, win } = await bootApp([Q1, Q2, Q3, 'Q4 should never be asked']);

  clickKid(doc, 'River');
  await typeAndSave(doc, 'I loved the park today');
  await dismissRevealsUntilFollowUp(doc);
  assertEqual(doc.querySelector('#followup-card .fu-q').textContent, Q1, 'first follow-up shows question 1');

  answerFollowUp(doc, 'Sedona and Dad were there');
  await waitFor(() => {
    const c = doc.getElementById('followup-card');
    return c && c.querySelector('.fu-q').textContent === Q2 ? c : null;
  }, 'second follow-up card');

  let entry = riverEntry();
  assertEqual(entry.text, 'I loved the park today', 'entry text untouched by follow-up answer');
  assertEqual(entry.followUps, [{ q: Q1, a: 'Sedona and Dad were there' }], 'answer 1 stored as its own Q&A pair');

  answerFollowUp(doc, 'Happy and a little sweaty');
  await waitFor(() => {
    const c = doc.getElementById('followup-card');
    return c && c.querySelector('.fu-q').textContent === Q3 ? c : null;
  }, 'third follow-up card');

  entry = riverEntry();
  assertEqual(entry.followUps.map(f => f.q), [Q1, Q2], 'each question keeps its own slot, in order');
  assertEqual(entry.followUps[1], { q: Q2, a: 'Happy and a little sweaty' }, 'answer 2 attached to question 2');
  assert(new Set(entry.followUps.map(f => f.q)).size === entry.followUps.length, 'no duplicate questions stored');

  answerFollowUp(doc, 'Because we laughed the whole time');
  await sleep(2500); // fly animation + would-be fetch
  entry = riverEntry();
  assertEqual(entry.followUps.length, 3, 'three answered follow-ups stored');
  assert(!doc.getElementById('followup-card'), 'no fourth question after MAX_FOLLOWUPS');
  assertEqual(win.__claudeCalls, 3, 'Claude asked exactly 3 times (cap respected)');

  // one-glowing-thought-per-night must still newline-join plain captures
  await typeAndSave(doc, 'Also the sunset was pretty');
  await sleep(1500);
  entry = riverEntry();
  assertEqual(entry.text, 'I loved the park today\nAlso the sunset was pretty', 'plain capture still joins tonight\'s thought');
  assertEqual(entry.followUps.length, 3, 'plain capture does not touch follow-up pairs');

  // Q&A pairs render wherever entries show — check the Thoughts tab of the treasures modal
  doc.getElementById('collection-btn').click();
  const thoughtsTab = await waitFor(() => [...doc.querySelectorAll('.tab-btn')]
    .find(b => b.textContent === '📖'), 'treasures modal tabs');
  thoughtsTab.click();
  await waitFor(() => doc.querySelector('#tab-content .entry-followups'), 'thoughts Q&A block');
  const qs = [...doc.querySelectorAll('#tab-content .entry-followups .efu-q')].map(el => el.textContent);
  assertEqual(qs, [Q1, Q2, Q3], 'thoughts list renders each question with its own answer');
}

/* ---- scenario 2: a repeated question never creates a second slot ---- */
async function scenarioRepeatedQuestion() {
  const QA = 'What made you smile the most?';
  const { doc, win } = await bootApp([QA, QA, QA]);

  clickKid(doc, 'River');
  await typeAndSave(doc, 'Pancakes for dinner');
  await dismissRevealsUntilFollowUp(doc);
  answerFollowUp(doc, 'The whipped cream tower');
  await sleep(2500); // second ask returns the same question → card must be skipped

  const entry = riverEntry();
  assertEqual(entry.followUps, [{ q: QA, a: 'The whipped cream tower' }], 'one unique question → exactly one answer');
  assert(!doc.getElementById('followup-card'), 'duplicate question from the model is not shown again');
  assertEqual(win.__claudeCalls, 2, 'model was consulted again but its repeat was rejected');
}

/* ---- scenario 3: each phone knows its person — codes only on somebody else's phone ---- */
async function scenarioPhoneOwnership() {
  const PINS = { records: {
    pin_river:  { id: 'pin_river',  type: 'pin', personId: 'river',  pin: '1111', updatedAt: 1 },
    pin_sedona: { id: 'pin_sedona', type: 'pin', personId: 'sedona', pin: '2222', updatedAt: 1 },
    pin_dad:    { id: 'pin_dad',    type: 'pin', personId: 'dad',    pin: '9999', updatedAt: 1 }
  } };

  // fresh phone: nobody picked yet → the picker asks, and the choice sticks
  let { doc } = await bootApp(['unused'], { phone_owner: null, data: PINS });
  const riverBtn = await waitFor(() => [...doc.querySelectorAll('.owner-btn')]
    .find(b => b.textContent.includes('River')), 'owner picker');
  report(true, 'first launch asks whose phone this is');
  riverBtn.click();
  assertEqual(JSON.parse(localStorage.getItem('wonderjar_phone_owner')), 'river', 'the choice is remembered on this phone');

  clickKid(doc, 'River');
  await waitFor(() => doc.getElementById('screen-journal').classList.contains('active'), 'own jar opens');
  assert(!doc.querySelector('.pin-input'), "River's jar opens with no code on River's phone");
  doc.getElementById('back-btn').click();

  clickKid(doc, 'Sedona');
  await waitFor(() => doc.querySelector('.pin-input'), 'pin modal for borrowed phone');
  assert(!doc.getElementById('screen-journal').classList.contains('active'),
    "Sedona's jar still asks for her code on River's phone");
  doc.querySelector('.modal-overlay .btn-secondary').click(); // never mind

  doc.getElementById('settings-btn').click();
  await waitFor(() => doc.querySelector('.pin-input'), 'settings pin modal on kid phone');
  assert(!doc.querySelector('.settings-box'), "grown-up stuff still asks for a parent code on River's phone");

  // a parent's phone opens every jar and grown-up stuff, no codes at all
  ({ doc } = await bootApp(['unused'], { phone_owner: 'dad', data: PINS }));
  assert(!doc.querySelector('.owner-btn'), 'picker does not reappear once the phone knows its person');
  clickKid(doc, 'Sedona');
  await waitFor(() => doc.getElementById('screen-journal').classList.contains('active'), 'kid jar on parent phone');
  assert(!doc.querySelector('.pin-input'), "a parent's phone opens a kid's jar with no code");
  doc.getElementById('back-btn').click();
  doc.getElementById('settings-btn').click();
  await waitFor(() => doc.querySelector('.settings-box'), 'settings on parent phone');
  assert(!doc.querySelector('.pin-input'), "a parent's phone opens grown-up stuff with no code");
}

/* ---- scenario 4: Star Blaster juice — score pops on contact, haptics option ---- */
async function scenarioBlasterJuice() {
  const { doc, win } = await bootApp(['unused']);

  // record vibrations instead of vibrating the test machine
  const buzzes = [];
  try { Object.defineProperty(win.navigator, 'vibrate', { value: (p) => { buzzes.push(p); return true; } }); }
  catch (e) { win.navigator.vibrate = (p) => { buzzes.push(p); return true; }; }

  // one laser about to hit a 1-hp comet worth 3 points — drive the real tick
  const state = (rocks, lasers) => ({
    running: true, over: false, frame: 1, score: 0, w: 300, h: 500, shipX: 150,
    lasers, rocks, bursts: [], pops: [], powerups: [], power: null, powerTime: 0,
    lives: 3, hitFlash: 0
  });
  let s = state([{ kind: '☄️', r: 13, hp: 1, pts: 3, speed: 1.6, zig: false, x: 100, y: 95, phase: 0 }],
                [{ x: 100, y: 100 }]);
  win.tickBlaster(s);
  assertEqual(s.score, 3, 'blasting a comet scores its points');
  assertEqual(s.pops.length, 1, 'a score number explodes at the contact point');
  assertEqual(s.pops[0] && s.pops[0].label, '+3', 'the exploding number shows the points earned');
  assert(buzzes.length === 1, 'the hit buzzes the phone when haptics are on');

  // a tough 2-hp rock: first hit sparks but no score pop, second hit pops
  const rock = { kind: '🪨', r: 19, hp: 2, pts: 2, speed: 0, zig: false, x: 100, y: 95, phase: 0 };
  s = state([rock], [{ x: 100, y: 100 }]);
  win.tickBlaster(s);
  assert(s.pops.length === 0 && s.score === 0 && rock.hp === 1, 'a tough rock takes the first hit without dying');
  assert(s.bursts.length === 1, 'the first hit still shows a contact spark');
  s.lasers.push({ x: rock.x, y: rock.y + 2 });
  win.tickBlaster(s);
  assert(s.pops.length === 1 && s.pops[0].label === '+2', 'the second hit explodes the score number');

  // the ship/rocks/shields must stay fully bright while a score number fades
  // (emoji inherit the fill's alpha — a fading pop once dimmed everything after it)
  const draws = [];
  const spyCtx = fillSpy(offscreenCtx(doc), () => true, draws);
  s = state([{ kind: '🪨', r: 19, hp: 2, pts: 2, speed: 0, zig: false, x: 80, y: 120, phase: 0 }], []);
  s.pops.push({ x: 150, y: 200, age: 28, label: '+5', big: true }); // mid-fade, alpha ≈ .25
  win.renderBlaster(s, spyCtx);
  win.renderBlaster(s, spyCtx); // second frame: leaked state would dim the rocks drawn early
  const emojiDraws = draws.filter(d => /🚀|🪨|☄️|🛸|🛡️/.test(d.txt));
  assert(emojiDraws.length >= 4, 'spy saw the ship, rock, and shield draws');
  assert(emojiDraws.every(d => alphaOf(d.fill) === 1), 'ship, rocks, and shields stay fully bright while numbers fade');
  const popDraws = draws.filter(d => d.txt === '+5');
  assert(popDraws.length && popDraws.every(d => alphaOf(d.fill) < 1), 'the fading number itself is still translucent');

  // ---- bonus guns ----
  const rockAt = (x, y, extra) => ({ kind: '🪨', r: 19, hp: 2, pts: 2, speed: 0, zig: false, x, y, phase: 0, ...extra });

  // rapid fire shoots far more often than the normal cadence
  const shotsOver = (frames, power) => {
    const st = state([], []);
    st.power = power; st.powerTime = 99999;
    let fired = 0;
    for (let i = 0; i < frames; i++) { st.frame++; const before = st.lasers.length; win.tickBlaster(st); fired += Math.max(0, st.lasers.length - before); }
    return fired;
  };
  const normalShots = shotsOver(120, null);
  const rapidShots = shotsOver(120, 'rapid');
  assert(rapidShots > normalShots * 2, 'rapid fire shoots way more often (' + rapidShots + ' vs ' + normalShots + ')');

  // triple shot puts three lasers up at once, spreading apart.
  // (BLAST_GAME is script-scoped, not on window — probe for a frame that fires.)
  let fireFrame = 0;
  for (let i = 1; i <= 240 && !fireFrame; i++) {
    const probe = state([], []);
    probe.frame = i;
    win.tickBlaster(probe);
    if (probe.lasers.length) fireFrame = i;
  }
  assert(fireFrame > 0, 'found the normal firing cadence');
  s = state([], []);
  s.power = 'triple'; s.powerTime = 99999; s.frame = fireFrame;
  win.tickBlaster(s);
  assertEqual(s.lasers.length, 3, 'triple shot fires three lasers at once');
  assert(new Set(s.lasers.map(l => l.dx)).size === 3, 'the three lasers spread in different directions');

  // mega blast one-shots a tough boulder AND clears its neighbours
  s = state([rockAt(100, 95), rockAt(130, 110), rockAt(260, 400)], [{ x: 100, y: 100, dx: 0 }]);
  s.power = 'mega'; s.powerTime = 99999;
  win.tickBlaster(s);
  assertEqual(s.score, 4, 'a mega blast cracks the boulder and its neighbour in one shot');
  assertEqual(s.pops.length, 2, 'every rock caught in the blast throws its own number');
  assert(s.rocks.length === 1 && s.rocks[0].x === 260, 'a far-away rock survives the shockwave');
  assert(s.bursts.some(b => b.mega), 'the mega shockwave draws its own big ring');

  // grabbing a dropped gun arms it, with a shout and a timer that runs down
  s = state([], []);
  s.powerups.push({ x: 150, y: 500 - 58 - 6, kind: 'rapid', age: 0 }); // right on the ship
  win.tickBlaster(s);
  assertEqual(s.power, 'rapid', 'flying into a bonus gun arms it');
  assert(s.powerTime > 0, 'the bonus gun starts a countdown');
  assert(s.pops.some(p => p.label === 'RAPID FIRE!' && p.word), 'grabbing it shouts the gun name');
  assertEqual(s.powerups.length, 0, 'the pickup is consumed');
  s.powerTime = 1;
  win.tickBlaster(s);
  assert(s.power === null && s.powerTime === 0, 'the bonus gun expires when its timer runs out');

  // wingmen: two escorts fire alongside you, from their own positions
  s = state([], []);
  s.power = 'wing'; s.powerTime = 99999; s.frame = fireFrame;
  win.tickBlaster(s);
  assertEqual(s.lasers.length, 3, 'wingmen add two more guns to your own');
  assert(new Set(s.lasers.map(l => Math.round(l.x))).size === 3, 'each ship fires from its own spot');
  assert(s.lasers.some(l => l.x < 150) && s.lasers.some(l => l.x > 150), 'the escorts flank you on both sides');

  // ---- space junk variety + scarcity ----
  const realRandom = win.Math.random;
  const spawnWith = (roll, score) => {
    win.Math.random = () => roll;
    const st = state([], []);
    st.score = score || 0;
    st.tier = Math.floor((score || 0) / 1000); // skip the announcement
    st.frame = win.blastDifficulty(st).spawnEvery;
    win.tickBlaster(st);
    return st;
  };
  assertEqual(spawnWith(0.001).rocks[0].kind, '🪨', 'the common roll is a plain asteroid');
  assertEqual(spawnWith(0.5).rocks[0].kind, '☄️', 'the middle of the table is a comet');
  assert(spawnWith(0.99).rocks[0].kind !== '🐄', 'even a 99th-percentile roll is not a cow');
  assertEqual(spawnWith(0.999).rocks[0].kind, '🐄', 'the cosmic cow sits at the very end of the table');
  const banana = spawnWith(0.945).rocks[0];
  assertEqual(banana.kind, '🍌', 'banana peels are in the rare band');
  assert(banana.pts > 10, 'the odd stuff pays much better than a rock');
  // every kind is reachable, and the junk-drawer items really are scarce
  win.Math.random = realRandom;
  const seen = {};
  for (let i = 0; i < 4000; i++) { const d = win.pickDebris(); seen[d.kind] = (seen[d.kind] || 0) + 1; }
  assert(Object.keys(seen).length >= 8, 'the sky serves up a real variety (' + Object.keys(seen).length + ' kinds)');
  assert((seen['🐄'] || 0) < 4000 * 0.02, 'cows stay genuinely rare (' + (seen['🐄'] || 0) + ' in 4000)');
  assert((seen['🪨'] || 0) > 4000 * 0.2, 'ordinary asteroids are still the bulk of it');

  // blasting something weird shouts its name on top of the score
  s = state([{ ...win.pickDebris(), kind: '🐄', r: 24, hp: 1, pts: 30, speed: 0, zig: false, shout: 'COSMIC COW!!', x: 100, y: 95, phase: 0 }],
            [{ x: 100, y: 100, dx: 0 }]);
  win.tickBlaster(s);
  assertEqual(s.score, 30, 'a cosmic cow is worth 30');
  assert(s.pops.some(p => p.label === 'COSMIC COW!!' && p.word), 'rare finds shout their name');
  assert(s.pops.some(p => p.label === '+30'), 'and still throw their score number');

  // ---- past 1000 points the sky turns mean ----
  const easy = win.blastDifficulty({ score: 0, frame: 0 });
  const hyper = win.blastDifficulty({ score: 1000, frame: 0 });
  const wild = win.blastDifficulty({ score: 2400, frame: 0 });
  assertEqual(easy.tier, 0, 'below 1000 is the normal sky');
  assertEqual(hyper.tier, 1, 'crossing 1000 moves up a tier');
  assert(hyper.spawnEvery < easy.spawnEvery, 'junk arrives faster past 1000');
  assert(hyper.speedMult > easy.speedMult, 'and it falls faster too');
  assert(wild.spawnEvery < hyper.spawnEvery && wild.speedMult > hyper.speedMult, 'it keeps ramping every 1000');
  assert(win.blastDifficulty({ score: 99000, frame: 9999 }).spawnEvery >= 20, 'the ramp has a floor so it stays playable');
  // the milestone announces itself exactly once
  s = state([], []);
  s.score = 1000;
  win.tickBlaster(s);
  assert(s.pops.some(p => p.label === 'HYPERSPACE!'), 'crossing 1000 announces HYPERSPACE');
  assertEqual(s.tier, 1, 'the tier is remembered');
  const popsAfter = s.pops.length;
  win.tickBlaster(s);
  assert(s.pops.filter(p => p.label === 'HYPERSPACE!').length === 1, 'it only announces once');
  assert(popsAfter >= 1, 'sanity: the announcement landed');

  // ---- Dark Nebula ----
  localStorage.setItem('wonderjar_dark_nebula', JSON.stringify(true));
  assert(win.darkNebulaOn(), 'Dark Nebula reads from this phone');
  const alphas = [];
  const darkSpy = fillSpy(offscreenCtx(doc), t => t === '🪨', alphas);
  s = state([rockAt(80, 20), rockAt(160, 290)], []);
  win.renderBlaster(s, darkSpy);
  const a0 = alphaOf(alphas[0].fill), a1 = alphaOf(alphas[1].fill);
  assert(a0 < 0.2, 'a far-off asteroid is nearly invisible in Dark Nebula');
  assert(a1 > a0, 'it fades up brighter as it falls toward you');
  // high scores stay separate so the two modes never share a leaderboard
  const darkKey = win.highKeyFor('blaster', 'river');
  localStorage.setItem('wonderjar_dark_nebula', JSON.stringify(false));
  assert(darkKey !== win.highKeyFor('blaster', 'river'), 'Dark Nebula keeps its own best score');
  alphas.length = 0;
  win.renderBlaster(s, darkSpy);
  assert(alphas.length === 2 && alphas.every(a => alphaOf(a.fill) === 1), 'with Dark Nebula off the asteroids are fully lit again');

  // the haptics toggle: off means silent, and the choice persists on this phone
  buzzes.length = 0;
  localStorage.setItem('wonderjar_haptics', JSON.stringify(false));
  win.buzz(20);
  assert(buzzes.length === 0, 'haptics off = no buzz');
  win.openArcade();
  const toggle = await waitFor(() => doc.getElementById('haptics-toggle'), 'arcade haptics toggle');
  assert(!toggle.checked, 'arcade toggle remembers haptics are off');
  toggle.checked = true;
  toggle.dispatchEvent(new win.Event('change'));
  assertEqual(JSON.parse(localStorage.getItem('wonderjar_haptics')), true, 'flipping the toggle saves the choice');
  assert(buzzes.length === 1, 'turning it on gives an instant taste buzz');
}

(async () => {
  const snapshot = snapshotStore();
  try {
    await scenarioUniquePairs();
    await scenarioRepeatedQuestion();
    await scenarioPhoneOwnership();
    await scenarioBlasterJuice();
  } catch (e) {
    report(false, 'test run crashed', e.message);
  } finally {
    restoreStore(snapshot);
    document.getElementById('stage').src = 'about:blank';
  }
  summary.textContent = failures === 0 ? 'PASS — all tests green ✨' : 'FAIL — ' + failures + ' failing';
  document.title = failures === 0 ? 'PASS' : 'FAIL';
  window.__testDone = true;
  window.__failures = failures;
})();
</script>
